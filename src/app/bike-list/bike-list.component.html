

<div *ngFor="let bikes of bikeList, let i = index; even as isEven" [ngStyle]="{'background-color': isEven ? 'skyblue' : 'indianred'}">
<mat-card>
  <app-bike-list-item [bike]="bikes">
  </app-bike-list-item>
</mat-card>

  <button matTooltip="Edit this Bike" mat-fab color="primary"(click)="onEdit(bikes)"> <mat-icon>edit</mat-icon></button>
  <button mat-fab matTooltip="Delete this Bike" (click)="deleteBike(bikes.number)">
    <mat-icon>delete</mat-icon>
  </button>
</div>
